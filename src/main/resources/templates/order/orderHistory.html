<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <th:block th:replace="~{module/link.html}"></th:block>
  <script th:src="@{js/orderHistory.js}"></script>
  <title>주문 내역</title>
</head>
<body>
  <th:block th:replace="~{module/header.html}"></th:block>

  <div class="container py-5 mt-4 mb-5" style="width: 90%; max-width: 1200px;">
    <h2 class="fw-bold text-center mb-5">구매 이력 / 주문 내역</h2>

    <!--/* 메시지 알림 (등록 성공/실패) */-->
    <div th:if="${message != null}" class="alert alert-success alert-dismissible fade show" role="alert">
      <span th:text="${message}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <span th:text="${errorMessage}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!--/* 주문 검색 */-->
    <form th:action="@{/orders}" method="get" class="card card-body mb-4">
      <input type="hidden" name="sortType" th:value="${sortType}">
      <div class="row g-2 align-items-end">

        <div class="col-md-4">
          <label class="form-label">상품명</label>
          <input type="text" name="keyword" th:value="${keyword}"
                 class="form-control" placeholder="상품명 검색">
        </div>
        <div class="col-md-3">
          <label class="form-label">시작일</label>
          <input type="date" name="startDate" th:value="${startDate}" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label">종료일</label>
          <input type="date" name="endDate" th:value="${endDate}" class="form-control">
        </div>
        <div class="col-md-2 d-flex gap-2">
          <button type="submit" class="btn btn-dark w-100">검색</button>
          <a th:href="@{/orders}" class="btn btn-outline-secondary w-100">초기화</a>
        </div>
      </div>
    </form>

    <!--/* 주문 정렬 */-->
    <div class="d-flex justify-content-end mb-3">
      <form th:action="@{/orders}" method="get">
        <input type="hidden" name="keyword" th:value="${keyword}">
        <input type="hidden" name="startDate" th:value="${startDate}">
        <input type="hidden" name="endDate" th:value="${endDate}">
        <label>
          <select name="sortType" class="form-select" style="width: 180px;"
                  onchange="this.form.submit()">
            <option value="recent" th:selected="${sortType == 'recent'}">최근 주문순</option>
            <option value="old" th:selected="${sortType == 'old'}">오래된 주문순</option>
          </select>
        </label>
      </form>
    </div>

    <!-- 날짜 입력 오류 -->
    <div th:if="${dateError != null}" class="alert alert-danger" th:text="${dateError}"></div>

    <!-- 주문 내역이 없을 때 -->
    <div th:if="${#lists.isEmpty(orders)}" class="text-center py-5">
      <p th:if="${keyword != '' or startDate != null or endDate != null}"
         class="text-muted fs-5">검색 결과가 없습니다.</p>
      <p th:unless="${keyword != '' or startDate != null or endDate != null}"
         class="text-muted fs-5">주문한 내역이 없습니다.</p>
      <a th:href="@{/}" class="btn btn-primary mt-2">쇼핑 계속하기</a>
    </div>

    <!-- 주문 내역 목록 -->
    <div th:unless="${#lists.isEmpty(orders)}">
      <div th:each="order : ${orders}" class="card mb-4">
        <!-- 주문 헤더 (주문일자 및 주문 상태) -->
        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
          <div>
            <span class="fw-bold fs-6" th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')} + ' 주문'"></span>
            <span class="badge bg-secondary ms-2" th:text="'주문번호 #' + ${order.id}"></span>
          </div>

          <div class="d-flex gap-2">
            <!-- 대표 상품 후기 작성 버튼 (배송완료 시 노출) -->
            <div th:if="${order.delivery != null and order.delivery.status == '배송완료'}">
              <button type="button"
                      class="btn btn-sm btn-outline-dark btnOpenReviewModal"
                      th:data-orderitem-id="${order.orderItems[0].id}"
                      th:data-product-name="${order.orderItems[0].product.name}">
                후기 작성
              </button>
            </div>
            <a th:href="@{|/order/${order.id}|}" class="btn btn-outline-secondary btn-sm">상세보기</a>
            <span th:if="${order.status == '주문완료'}" class="badge bg-primary fs-6 d-inline-flex align-items-center">주문완료</span>
            <span th:if="${order.status == '주문취소'}" class="badge bg-danger fs-6 d-inline-flex align-items-center">주문취소</span>
          </div>
        </div>

        <!--/* 대표 상품 : 접힌 상태에서도 항상 표시 */-->
        <div class="card-body">
          <div class="d-flex align-items-center py-3 border-bottom"
               data-bs-toggle="collapse"
               th:attr="data-bs-target=|#order-${order.id}|,aria-controls=|order-${order.id}|"
               aria-expanded="false"
               style="cursor: pointer;">

            <div class="flex-shrink-0 me-3">
              <!--/* 대표 상품 썸네일 이미지 */-->
              <img th:src="@{|/images/${order.orderItems[0].product.fileName1}|}"
                   th:alt="${order.orderItems[0].product.name}"
                   class="rounded me-3"
                   style="width: 70px; height: 70px; object-fit: cover;">
            </div>

            <!--/* 대표 상품 정보 */-->
            <div class="flex-grow-1">
              <h6 class="fw-bold mb-1">
                <span th:text="${order.orderItems[0].product.name}">상품명</span>
                <span th:if="${#lists.size(order.orderItems) > 1}"
                      th:id="|order-extra-${order.id}|"
                      th:text="' 외 ' + ${#lists.size(order.orderItems) - 1} + '종'"></span>
              </h6>
              <span class="text-muted small"
                    th:text="${#numbers.formatInteger(order.orderItems[0].orderPrice, 0, 'COMMA')} + '원 / ' + ${order.orderItems[0].count} + '개'">
              </span>
            </div>
            <div class="text-end ms-3 d-flex align-items-center gap-3">
              <span class="fw-bold text-dark fs-6"
                    th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA')} + '원'">
              </span>
              <i th:if="${#lists.size(order.orderItems) > 1}" class="bi bi-chevron-down fs-5 order-arrow" th:id="|order-arrow-${order.id}|"></i>
            </div>

          </div>

          <!-- 펼쳤을 때 표시 -->
          <div class="collapse order-collapse" th:id="|order-${order.id}|"
               th:attr="data-order-id=${order.id}">

            <!-- 대표 상품을 제외한 나머지 상품 -->
            <th:block th:each="orderItem, itemStat : ${order.orderItems}">
              <div th:if="${itemStat.index > 0}"
                   class="d-flex align-items-center py-3 border-bottom">

                <div class="flex-shrink-0 me-3">
                  <img th:src="@{|/images/${orderItem.product.fileName1}|}"
                       th:alt="${orderItem.product.name}"
                       class="rounded me-3" style="width: 70px; height: 70px; object-fit: cover;">
                </div>

                <!--/* 상품 정보 */-->
                <div class="flex-grow-1">
                  <h6 class="fw-bold mb-1"
                      th:text="${orderItem.product.name}">상품명</h6>

                  <span class="text-muted small"
                        th:text="${#numbers.formatInteger(orderItem.orderPrice, 0, 'COMMA')} + '원 / ' + ${orderItem.count} + '개'">
                  </span>
                </div>

                <div class="text-end ms-3">
                  <span class="fw-bold text-dark fs-6"
                        th:text="${#numbers.formatInteger(orderItem.totalPrice, 0, 'COMMA')} + '원'">
                  </span>
                </div>
              </div>
            </th:block>
          </div>

          <!-- 배송 상태 및 주문 취소 버튼 영역 -->
          <div class="d-flex justify-content-between align-items-center mt-3 pt-2">
            <div class="small text-muted">
              배송상태:
              <span class="fw-bold text-dark" th:text="${order.delivery.status}"></span>
              <span class="ms-2">| 수령인: <span th:text="${order.delivery.receiverName}"></span></span>
            </div>

            <div>
              <!-- order Status가 '주문완료' 또는 delivery Status가 '상품준비중' 상태일 때만 취소 버튼 노출 -->
              <form th:if="${order.status == '주문완료' and order.delivery.status == '상품준비중'}"
                    th:action="@{'/orders/' + ${order.id} + '/cancel'}" method="post" style="display: inline;"
                    onsubmit="return confirm('해당 주문을 취소하시겠습니까? (재고가 복구됩니다)');">
                <button type="submit" class="btn btn-outline-danger btn-sm">주문 취소</button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- 페이징 -->
      <nav th:if="${orderPage.totalPages > 1}">
        <ul class="pagination justify-content-center">
          <li class="page-item" th:classappend="${orderPage.first} ? 'disabled'">
            <a class="page-link"
               th:href="@{/orders(page=${orderPage.number - 1},keyword=${keyword},startDate=${startDate},endDate=${endDate},sortType=${sortType})}">
              <i class="bi bi-chevron-left"></i>
            </a>
          </li>
          <li class="page-item"
              th:each="pageNumber : ${#numbers.sequence(0, orderPage.totalPages - 1)}"
              th:classappend="${pageNumber == orderPage.number} ? 'active'">
            <a class="page-link"
               th:href="@{/orders(page=${pageNumber},keyword=${keyword},startDate=${startDate},endDate=${endDate},sortType=${sortType})}"
               th:text="${pageNumber + 1}">1</a>
          </li>
          <li class="page-item" th:classappend="${orderPage.last} ? 'disabled'">
            <a class="page-link"
               th:href="@{/orders(page=${orderPage.number + 1},keyword=${keyword},startDate=${startDate},endDate=${endDate},sortType=${sortType})}">
              <i class="bi bi-chevron-right"></i>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </div>

  <!--/* 후기 작성 모달창 */-->
  <div class="modal fade" id="reviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form th:action="@{/reviews}" method="post">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">상품 후기 작성</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" name="orderItemId" id="modalOrderItemId">

            <div class="mb-3">
              <label class="form-label text-muted small mb-1">상품명</label>
              <div id="modalProductName" class="fw-bold text-dark fs-6"></div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">평점</label>
              <select name="rating" class="form-select" required>
                <option value="5" selected>★★★★★ (5점 - 최고예요)</option>
                <option value="4">★★★★☆ (4점 - 좋아요)</option>
                <option value="3">★★★☆☆ (3점 - 보통이에요)</option>
                <option value="2">★★☆☆☆ (2점 - 아쉬워요)</option>
                <option value="1">★☆☆☆☆ (1점 - 별로예요)</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">후기 내용</label>
              <textarea name="content" class="form-control" rows="4"
                        placeholder="상품을 실제로 사용해 보신 솔직한 리뷰를 남겨주세요." required></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary rounded-0" data-bs-dismiss="modal">취소</button>
            <button type="submit" class="btn btn-dark rounded-0">등록하기</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!--/* 하단: 풋터 */-->
  <th:block th:replace="~{module/footer.html}"></th:block>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const reviewModalEl = document.getElementById("reviewModal");
      if (!reviewModalEl) return;
      const reviewModal = new bootstrap.Modal(reviewModalEl);

      document.querySelectorAll(".btnOpenReviewModal").forEach(button => {
        button.addEventListener("click", function () {
          const orderItemId = this.dataset.orderitemId;
          const productName = this.dataset.productName;

          document.getElementById("modalOrderItemId").value = orderItemId;
          document.getElementById("modalProductName").textContent = productName;

          reviewModal.show();
        });
      });
    });
  </script>
</body>
</html>
