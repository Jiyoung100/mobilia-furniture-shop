<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{module/link.html}"></th:block>
    <title>주문 상세 내역</title>
</head>
<body>
    <th:block th:replace="~{module/header.html}"></th:block>

    <div class="container py-5 mt-4 mb-5" style="width: 90%; max-width: 1200px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0">주문 상세 내역</h3>
            <a th:href="@{/orders}" class="btn btn-outline-secondary btn-sm">목록으로 돌아가기</a>
        </div>

        <!-- 1. 기본 주문 개요 -->
        <div class="card mb-4 border-0 bg-light">
            <div class="card-body d-flex justify-content-between align-items-center py-3">
                <div>
                    <span class="text-muted small">주문번호: </span>
                    <span class="fw-bold me-3" th:text="${order.id}"></span>
                    <span class="text-muted small">주문일시: </span>
                    <span th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm:ss')}"></span>
                </div>
                <div>
                    <span th:if="${order.status == 'ORDER'}" class="badge bg-primary fs-6">주문완료</span>
                    <span th:if="${order.status == 'CANCEL'}" class="badge bg-danger fs-6">주문취소</span>
                </div>
            </div>
        </div>

        <!-- 2. 주문 상품 목록 -->
        <div class="card mb-4">
            <div class="card-header bg-white py-3">
                <h5 class="fw-bold mb-0">주문 상품 정보</h5>
            </div>
            <div class="card-body">
                <div th:each="item : ${order.orderItems}" class="row align-items-center py-3 border-bottom">
                    <div class="col-2 col-md-2">
                        <img th:src="@{|/images/${item.product.fileName1}|}" alt="상품 이미지" class="img-fluid rounded" style="max-height: 70px; object-fit: cover;">
                    </div>
                    <div class="col-6 col-md-7">
                        <h6 class="fw-bold mb-1" th:text="${item.product.name}">상품명</h6>
                        <span class="text-muted small"
                              th:text="|${#numbers.formatInteger(item.orderPrice, 0, 'COMMA')}원 / ${item.count}개|">
                        </span>
                    </div>
                    <div class="col-4 col-md-3 text-end">
                        <span class="fw-bold fs-6 text-dark"
                              th:text="|${#numbers.formatInteger(item.totalPrice != 0 ? item.totalPrice : item.orderPrice * item.count, 0, 'COMMA')}원|">
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. 배송지 & 배송 상태 정보 -->
        <div class="card mb-4">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="fw-bold mb-0">배송 정보</h5>
                <!-- 주문취소가 아닐 때만 배송 상태 뱃지 노출 (주문취소 시 숨김) -->
                <div th:if="${order.status != '주문취소'}">
                    <span th:if="${order.delivery.status == '상품준비중'}" class="badge bg-warning text-dark">상품준비중</span>
                    <span th:if="${order.delivery.status == '배송중'}" class="badge bg-info text-dark">배송중</span>
                    <span th:if="${order.delivery.status == '배송완료'}" class="badge bg-success">배송완료</span>
                </div>
            </div>
            <div class="card-body">
                <div class="row py-2 border-bottom">
                    <div class="col-3 col-sm-2 text-muted">수령인</div>
                    <div class="col-9 col-sm-10 fw-semibold" th:text="${order.delivery.receiverName}"></div>
                </div>
                <div class="row py-2 border-bottom">
                    <div class="col-3 col-sm-2 text-muted">연락처</div>
                    <div class="col-9 col-sm-10" th:text="${order.delivery.receiverPhone}"></div>
                </div>
                <div class="row py-2" th:classappend="${order.delivery.deliveryDate != null} ? 'border-bottom' : ''">
                    <div class="col-3 col-sm-2 text-muted">배송주소</div>
                    <div class="col-9 col-sm-10" th:if="${order.delivery.address != null}">
                        <span th:text="|(${order.delivery.address.zipcode}) ${order.delivery.address.basicAddress} ${order.delivery.address.detailAddress}|"></span>
                    </div>
                </div>
                <div class="row py-2" th:if="${order.delivery.deliveryDate != null}">
                    <div class="col-3 col-sm-2 text-muted">배송완료일</div>
                    <div class="col-9 col-sm-10 text-success fw-semibold"
                         th:text="${#temporals.format(order.delivery.deliveryDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
        </div>

        <!-- 4. 결제 금액 정보 -->
        <div class="card mb-4">
            <div class="card-body d-flex justify-content-between align-items-center py-4">
                <span class="fs-5 fw-bold">총 결제 금액</span>
                <span class="fs-4 fw-bold text-primary"
                      th:text="|${#numbers.formatInteger(totalPrice, 0, 'COMMA')}원|"></span>
            </div>
        </div>
    </div>

    <th:block th:replace="~{module/footer.html}"></th:block>
</body>
</html>
