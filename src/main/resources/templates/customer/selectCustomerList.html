<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>전체 회원</title>
    <th:block th:replace="~{module/link.html}"></th:block>
    <link rel="stylesheet" th:href="@{/css/adminCommon.css}">
    <link rel="stylesheet" th:href="@{/css/selectCustomerList.css}">
    <link rel="stylesheet" th:href="@{/css/adminSidebar.css}">
    <script th:src="@{/js/selectCustomerList.js}"></script>
</head>
<body>
    <div class="admin-layout">
        <!--/* 왼쪽 : 사이드바 */-->
        <th:block th:replace="~{module/adminSidebar.html}"></th:block>
        <article class="wrapper">
            <h3>전체 회원 목록</h3>
            <form class="section01 shadow-sm" th:action="@{/customers/admin/list}" method="get">
                <input type="hidden" name="sort" th:value="${sort}">
                <div class="search-row">
                    <div class="search-item">
                        <label>가입일</label>
                        <input type="date" name="startDate" th:value="${startDate}">
                        <span class="date-sep">-</span>
                        <input type="date" name="endDate" th:value="${endDate}">
                    </div>
                    <div class="search-item">
                        <label>전화번호</label>
                        <input type="text" name="phone" th:value="${phone}" placeholder="예: 010-1234-5678">
                    </div>
                </div>
                <div class="search-row">
                    <div class="search-item">
                        <label>회원 ID</label>
                        <input type="text" name="customerId" th:value="${customerId}" placeholder="예: user01">
                    </div>
                    <div class="search-item">
                        <label>이름</label>
                        <input type="text" name="name" th:value="${name}" placeholder="회원명 검색">
                    </div>
                </div>
                <div class="search-row">
                    <div class="search-item">
                        <label>성별</label>
                        <select name="gender">
                            <option value="" th:selected="${gender == '' || gender == null}">전체</option>
                            <option value="남" th:selected="${gender == '남' || gender == '남성'}">남성</option>
                            <option value="여" th:selected="${gender == '여' || gender == '여성'}">여성</option>
                        </select>
                    </div>
                    <div class="search-item">
                        <label>권한</label>
                        <select name="role">
                            <option value="" th:selected="${role == '' || role == null}">전체</option>
                            <option value="USER" th:selected="${role == 'USER'}">USER</option>
                            <option value="ADMIN" th:selected="${role == 'ADMIN'}">ADMIN</option>
                            <option value="MANAGER" th:selected="${role == 'MANAGER'}">MANAGER</option>
                        </select>
                    </div>
                </div>
                <div class="searchBox05">
                    <a th:href="@{/customers/admin/list}">초기화</a>
                    <button type="submit">검색</button>
                </div>
            </form>
            <!--/* selectCustomerList.js에서 삭제 제출 이벤트를 감지하는 폼 */-->
            <form id="bulkDeleteForm" class="section02 shadow-sm" th:action="@{/customers/admin/delete}" method="post">
                <div>
                    <div class="delete-actions">
                        <button type="submit" id="deleteButton">선택 삭제</button>
                    </div>
                    <div class="manage-actions">
                        <select id="sort" name="sort">
                            <option value="latest" th:selected="${sort == 'latest' || sort == null || sort == ''}">최근 가입순</option>
                            <option value="oldest" th:selected="${sort == 'oldest'}">오래된 가입순</option>
                        </select>
                        <a th:href="@{/customers/signup}">등록</a>
                    </div>
                </div>
                <div class="list-summary">
                    <span th:text="|[전체 회원 수 ${paging.totalElements}명]|"></span>
                </div>
                <div class="table-scroll">
                    <table>
                        <tr>
                            <th>
                                <input type="checkbox" id="chkAll">
                            </th>
                            <th>번호</th>
                            <th>회원 ID</th>
                            <th>이름</th>
                            <th>이메일</th>
                            <th>권한</th>
                            <th>가입일</th>
                            <th>관리</th>
                        </tr>
                        <tr th:each="customer : ${paging}">
                            <td>
                                <!--/* 각 회원의 선택 상태를 관리하며 삭제 요청 시 customerIds 이름으로 전송함 */-->
                                <input type="checkbox" class="customer-checkbox"
                                       name="customerIds" th:value="${customer.id}">
                            </td>
                            <td th:text="${customer.id}"></td>
                            <td th:text="${customer.customerId}"></td>
                            <td th:text="${customer.name}"></td>
                            <td th:text="${customer.email}"></td>
                            <td th:text="${customer.role}"></td>
                            <td th:text="${#temporals.format(customer.regDate, 'yyyy-MM-dd')}"></td>
                            <td>
                                <a th:href="@{/customers/admin/update/{id}(id=${customer.id})}">
                                    수정
                                </a>
                                <button type="button"
                                        class="single-delete-btn"
                                        th:data-url="@{/customers/admin/delete/{id}(id=${customer.id})}">
                                    삭제
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${paging.isEmpty()}">
                            <td colspan="8" style="padding: 30px; color: #888;">등록된 회원이 없습니다.</td>
                        </tr>
                    </table>
                </div>
            </form>
            <!--/* 페이지네이션 */-->
            <th:block th:with="queryParams=|&startDate=${startDate}&endDate=${endDate}&name=${name}&productId=${productId}&country=${country}|">
                <th:block th:replace="~{module/pagination :: pagination(${paging}, '/products/admin/list', ${queryParams})}"></th:block>
            </th:block>
            <div class="current-page-info" th:if="${paging != null and !paging.isEmpty()}">
                <span th:text="|현재 페이지 ${paging.number + 1}/${paging.totalPages}페이지|"></span>
            </div>
        </article>
    </div>
</body>
</html>
