<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{/module/link.html}"></th:block>
    <link rel="stylesheet" th:href="@{/css/signup.css}">
    <link rel="stylesheet" th:href="@{/css/adminCommon.css}">
    <link rel="stylesheet" th:href="@{/css/adminSidebar.css}">
    <script th:src="@{/js/searchAddress.js}"></script>
    <title>관리자 - 회원 정보 수정</title>
</head>
<body>
<main class="admin-layout">
    <!--/* 왼쪽 : 사이드바 */-->
    <th:block th:replace="~{/module/adminSidebar.html}"></th:block>

    <article class="wrapper">
        <h3>회원 정보 수정</h3>
<!--        <h5>관리자 권한으로 회원 정보를 수정합니다.</h5>-->
        <form th:object="${customer}" th:action="@{|/customers/admin/update/${customer.id}|}" method="post" novalidate>
            <!-- DB 식별용 PK (Hidden) -->
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{address.id}" th:if="*{address != null}">

            <div class="card border-0 shadow-sm p-5">
            <section class="signup-section">
                <h3>계정 정보</h3>
                <div class="signup-box">
                    <div class="input-box">
                        <label>아이디</label>
                        <input type="text" th:field="*{customerId}" readonly>
                        <p class="text-danger" th:errors="*{customerId}"></p>
                    </div>
                    <div class="input-box">
                        <label>권한</label>
                        <select th:field="*{role}">
                            <option value="USER">USER</option>
                            <option value="ADMIN">ADMIN</option>
                            <option value="MANAGER">MANAGER</option>
                        </select>
                        <p class="text-danger" th:errors="*{role}"></p>
                    </div>
                </div>
                <div class="signup-box">
                    <div class="input-box">
                        <label>새 비밀번호</label>
                        <input type="password" th:field="*{password}" placeholder="변경할 비밀번호를 입력해주세요.">
                        <p class="text-danger" th:errors="*{password}"></p>
                    </div>
                    <div class="input-box">
                        <label>새 비밀번호 확인</label>
                        <input type="password" th:field="*{password1}" placeholder="비밀번호를 다시 입력해주세요.">
                        <p class="text-danger" th:errors="*{password1}"></p>
                    </div>
                </div>
            </section>
            <section class="signup-section">
                <h3>회원 정보</h3>
                <div class="signup-box">
                    <div class="input-box">
                        <label>성별</label>
                        <div class="gender-box">
                            <label class="radio-style">
                                <input type="radio" th:field="*{gender}" value="남">
                                <span>남</span>
                            </label>

                            <label class="radio-style">
                                <input type="radio" th:field="*{gender}" value="여">
                                <span>여</span>
                            </label>
                        </div>
                        <p class="text-danger" th:errors="*{gender}"></p>
                    </div>
                </div>
                <div class="signup-box">
                    <div class="input-box">
                        <label>이름</label>
                        <input type="text" th:field="*{name}" placeholder="이름을 입력해주세요.">
                        <p class="text-danger" th:errors="*{name}"></p>
                    </div>

                    <div class="input-box">
                        <label>닉네임</label>
                        <input type="text" th:field="*{nickname}" placeholder="닉네임을 입력해주세요.">
                        <p class="text-danger" th:errors="*{nickname}"></p>
                    </div>
                </div>
                <div class="signup-box">
                    <div class="input-box">
                        <label>국적</label>
                        <select th:field="*{address.country}">
                            <option value="">국적을 선택해주세요.</option>
                            <option value="대한민국">대한민국</option>
                            <option value="미국">미국</option>
                            <option value="일본">일본</option>
                            <option value="중국">중국</option>
                            <option value="캐나다">캐나다</option>
                            <option value="영국">영국</option>
                            <option value="프랑스">프랑스</option>
                            <option value="독일">독일</option>
                            <option value="호주">호주</option>
                            <option value="뉴질랜드">뉴질랜드</option>
                            <option value="베트남">베트남</option>
                            <option value="태국">태국</option>
                            <option value="필리핀">필리핀</option>
                            <option value="인도네시아">인도네시아</option>
                            <option value="인도">인도</option>
                            <option value="싱가포르">싱가포르</option>
                            <option value="대만">대만</option>
                            <option value="홍콩">홍콩</option>
                        </select>
                        <p class="text-danger" th:errors="*{address.country}"></p>
                    </div>
                    <div class="input-box">
                        <label>생년월일</label>
                        <input type="date" th:field="*{birthday}">
                        <p class="text-danger" th:errors="*{birthday}"></p>
                    </div>
                </div>
                <div class="signup-box">
                    <div class="input-box">
                        <label>이메일</label>
                        <input type="email" th:field="*{email}" placeholder="이메일을 입력해주세요.">
                        <p class="text-danger" th:errors="*{email}"></p>
                    </div>
                    <div class="input-box">
                        <label>휴대폰 번호</label>
                        <input type="text" th:field="*{phone}" placeholder="010-1234-5678">
                        <p class="text-danger" th:errors="*{phone}"></p>
                    </div>
                </div>
            </section>
            <section class="signup-section">
                <h3>주소 정보</h3>
                <div class="signup-box">
                    <div class="input-box">
                        <label>우편번호</label>
                        <div class="address-box">
                            <input type="text" class="zipcode" th:field="*{address.zipcode}" readonly>
                            <button type="button" class="btnAddress">주소 찾기</button>
                        </div>
                        <p class="text-danger" th:errors="*{address.zipcode}"></p>
                    </div>
                </div>
                <div class="signup-box">
                    <div class="input-box">
                        <label>기본주소</label>
                        <input type="text" class="basicAddress" th:field="*{address.basicAddress}" readonly>
                        <p class="text-danger" th:errors="*{address.basicAddress}"></p>
                    </div>
                    <div class="input-box">
                        <label>상세주소</label>
                        <input type="text" th:field="*{address.detailAddress}" placeholder="상세주소를 입력해주세요.">
                        <p class="text-danger" th:errors="*{address.detailAddress}"></p>
                    </div>
                </div>
            </section>
            <div class="join-btn">
                <button type="submit">수정 완료</button>
                <a th:href="@{/customers/admin/list}">취소</a>
            </div>
            </div>
        </form>
    </article>
</main>
</body>
</html>
