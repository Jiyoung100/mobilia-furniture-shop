<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{/module/link.html}"></th:block>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <title>로그인</title>
</head>
<body>
    <!--/* 상단: 헤더 */-->
    <th:block th:replace="~{/module/header.html}"></th:block>

    <article class="wrapper">
        <h2>로그인</h2>
        <h5>로그인하여 더욱 편리하게 다양한 서비스를 이용해 보세요</h5>
        <form th:action="@{/login}" method="post">
            <section>
                <div th:if="${error}" class="login-error">
                    <p>아이디 또는 비밀번호가 일치하지 않습니다.</p>
                </div>
                <div class="input-box">
                    <label for="customerId">아이디</label>
                    <input type="text" name="customerId" id="customerId" placeholder="아이디를 입력해주세요.">
                </div>
                <div class="input-box">
                    <label for="password">비밀번호</label>
                    <input type="password" name="password" id="password" placeholder="비밀번호를 입력해주세요.">
                </div>
            </section>
            <section>
                <div class="login-btn">
                    <button type="submit">로그인</button>
                </div>
                <div class="signup-btn">
                    <span>아직 회원이 아니신가요?</span>
                    <a th:href="@{/customers/signup}">회원가입</a>
                </div>
            </section>
        </form>
    </article>

    <!--/* 하단: 풋터 */-->
    <th:block th:replace="~{/module/footer.html}"></th:block>
</body>
</html>
