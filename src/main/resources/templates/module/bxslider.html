	<link rel="stylesheet" href="https://cdn.jsdelivr.net/bxslider/4.2.12/jquery.bxslider.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="https://cdn.jsdelivr.net/bxslider/4.2.12/jquery.bxslider.min.js"></script>

	<script>
		$(document).ready(() => {
			const $section = $('.related-product');
			const $list = $section.find('.slider');

			if (!$list.length || !$list.children().length) return;

			const itemCount = $list.children().length;
			const slideWidth = 280;
			const slideMargin = 24;
			const minSlides = Math.min(2, itemCount);
			const maxSlides = Math.min(5, itemCount);

			let slider;

			function getTotalPages() {
				const viewportWidth = $list.closest('.bx-viewport').width();

				const minWidth = minSlides * slideWidth + (minSlides - 1) * slideMargin;
				const maxWidth = maxSlides * slideWidth + (maxSlides - 1) * slideMargin;

				let visibleCount;

				if (viewportWidth < minWidth) {
					visibleCount = minSlides;
				} else if (viewportWidth > maxWidth) {
					visibleCount = maxSlides;
				} else {
					const itemWidth = $list.children().first().width();

					visibleCount = Math.floor(
							(viewportWidth + slideMargin) /
							(itemWidth + slideMargin)
					);
				}

				return Math.ceil(itemCount / Math.max(1, visibleCount));
			}

			function updatePage() {
				if (!slider) return;

				$section.find('.current-page')
						.text(slider.getCurrentSlide() + 1);

				$section.find('.total-page')
						.text(getTotalPages());
			}

			slider = $list.bxSlider({
				slideWidth: slideWidth,
				minSlides: minSlides,
				maxSlides: maxSlides,
				slideMargin: slideMargin,
				moveSlides: 0,
				shrinkItems: true,
				controls: true,
				pager: false,
				auto: false,
				infiniteLoop: false,
				touchEnabled: false,

				onSliderLoad: function() {
					// 초기화가 끝난 다음 페이지 수 갱신
					setTimeout(updatePage, 0);
				},

				onSlideAfter: function() {
					updatePage();
				},

				onSliderResize: function() {
					setTimeout(updatePage, 0);
				}
			});

			$section.find('.bx-next').off('click').on('click', function(e) {
				e.preventDefault();

				if (slider.getCurrentSlide() === getTotalPages() - 1) {
					slider.goToSlide(0);
				} else {
					slider.goToNextSlide();
				}
			});

			$section.find('.bx-prev').off('click').on('click', function(e) {
				e.preventDefault();

				if (slider.getCurrentSlide() === 0) {
					slider.goToSlide(getTotalPages() - 1);
				} else {
					slider.goToPrevSlide();
				}
			});
		});
	</script>
