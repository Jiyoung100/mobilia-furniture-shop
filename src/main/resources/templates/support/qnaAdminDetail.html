<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Q&A 관리</title>
	<th:block th:replace="~{module/link.html}"></th:block>
	<link rel="stylesheet" th:href="@{/css/question.css}">
	<link rel="stylesheet" th:href="@{/css/qna.css}">
	<script th:src="@{/js/qna.js}"></script>
</head>
<body>
	<!--/* 상단: 헤더 */-->
	<th:block th:replace="~{module/header.html}"></th:block>

	<article class="question-wrapper">
		<section class="question-title">
			<h2>문의 상세</h2>
		</section>
		<section class="qna-detail-wrapper">
			<div class="qna-detail">
				<div class="qna-detail-row flex-column flex-md-row">
					<span>회원ID</span>
					<p>[[${qna.customer.customerId}]]</p>
				</div>
				<div class="qna-detail-row flex-column flex-md-row">
					<span>문의분류</span>
					<p>[[${qna.category}]]</p>
				</div>
				<div class="qna-detail-row flex-column flex-md-row">
					<span>상품코드</span>
					<p th:if="${qna.productId != null and qna.productId != ''}">[[${qna.productId}]]</p>
					<p th:if="${qna.productId == null or qna.productId == ''}">-</p>
				</div>
				<div class="qna-detail-row flex-column flex-md-row">
					<span>제목</span>
					<p>[[${qna.title}]]</p>
				</div>
				<div class="qna-detail-row flex-column flex-md-row">
					<span>작성일</span>
					<p>[[${#temporals.format(qna.createDate, 'yyyy-MM-dd HH:mm')}]]</p>
				</div>
				<div class="qna-detail-content flex-column flex-md-row">
					<span>문의내용</span>
					<div>[[${qna.content}]]</div>
				</div>
			</div>
			<div class="qna-answer-box">
				<h4>답변</h4>
				<form th:action="@{/support/admin/answer/{id}(id=${qna.id})}" method="post" class="qna-answer-form">
					<textarea name="answer" rows="8" placeholder="답변을 입력해주세요.">[[${qna.answer}]]</textarea>
					<div class="qna-answer-btn">
						<button type="submit">답변 등록</button>
					</div>
				</form>
			</div>
			<div class="qna-detail-btn flex-wrap">
				<a th:href="@{/support/admin/list}">목록</a>
				<form th:action="@{/support/admin/delete/{id}(id=${qna.id})}" method="post" class="qnaAdminDeleteForm">
					<button type="submit" class="btnQnaDelete">삭제</button>
				</form>
			</div>
		</section>
	</article>

	<!--/* 하단: 풋터 */-->
	<th:block th:replace="~{module/footer.html}"></th:block>
</body>
</html>
