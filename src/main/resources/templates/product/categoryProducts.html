<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{module/link.html}"></th:block>
    <script th:src="@{/js/sort.js}"></script>
    <title>공간별 가구</title>
</head>
<body>
    <!-- 상단: 메뉴 -->
    <th:block th:replace="~{module/header.html}"></th:block>

    <!-- 중단: 상품 진열 -->
    <div class="wrapper py-5 mt-3">
        <h2 class="fw-bold text-center mb-5">[[${category1}]]</h2>
        <!--/* category2 버튼 */-->
        <div class="d-flex align-items-center justify-content-center gap-3 category-btn-wrap">
            <a th:href="@{|/products/category/${category1}|}" class="btn"
               th:classappend="${category2 == null || category2.isEmpty()} ? 'btn-secondary' : 'btn-outline-secondary'">
                전체
            </a>
            <a th:each="item : ${category2List}" th:href="@{|/products/category/${category1}?category2=${item}|}"
               class="btn" th:classappend="${category2 == item} ? 'btn-secondary' : 'btn-outline-secondary'">
                [[${item}]]
            </a>
        </div>
        <div class="d-flex align-items-end py-4 mb-5 border-bottom">
            <span>전체 <b>[[${paging.totalElements}]]</b>건</span>
            <div class="ms-auto">
                <select name="sort" id="sort" class="form-select" aria-label="Default select example">
                    <option value="new" th:selected="${sort == 'new'}">신상품</option>
                    <option value="lowPrice" th:selected="${sort == 'lowPrice'}">낮은가격순</option>
                    <option value="highPrice" th:selected="${sort == 'highPrice'}">높은가격순</option>
                </select>
            </div>
        </div>
        <div class="row g-5">
            <!--/* 상품 반복 출력 */-->
            <div th:each="product : ${paging}" class="col-6 col-lg-3">
                <th:block th:replace="~{module/productCard.html :: productCard(${product})}"></th:block>
            </div>
        </div>
    </div>

    <!--/* 페이징 바 */-->
    <th:block th:with="queryParams=${category2 != null && !category2.isEmpty() ? '&category2=' + category2 + '&sort=' + sort : '&sort=' + sort}">
        <th:block th:replace="~{module/pagination :: pagination(${paging}, ${'/products/category/' + category1}, ${queryParams})}"></th:block>
    </th:block>

    <!--/* 하단: 풋터 */-->
    <th:block th:replace="~{module/footer.html}"></th:block>
</body>
</html>
