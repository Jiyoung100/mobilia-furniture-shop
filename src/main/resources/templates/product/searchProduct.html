<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{/module/link.html}"></th:block>
    <title>검색결과 조회</title>
</head>
<body>
<!--/* 상단: 메뉴 */-->
<th:block th:replace="~{/module/header.html}"></th:block>

<!--/* 중단: 상품 진열 */-->
<div class="container py-5 mt-5">
    <!--/* 검색어 입력시 검색결과화면 출력문구 */-->
    <div th:if="${keyword != null and keyword != ''}" class="text-center mb-5">
        <h3>'<span th:text="${keyword}" class="fw-bold"></span>' 검색결과</h3>
        <h5 class="mt-3"><b>[[${paging.totalElements}]]</b>개의 상품이 검색되었습니다.</h5>
    </div>

    <!--/* 검색어 미입력시 검색결과화면 출력문구 */-->
    <h5 th:unless="${keyword != null and keyword != ''}" class="fw-bold text-center mb-5">전체상품이 검색되었습니다.</h5>

    <div class="d-flex justify-content-between align-items-center">
        <div class="row g-5 w-100">
            <!-- 상품 반복 출력 -->
            <div th:each="product : ${paging}" class="col-6 col-lg-3">
                <th:block th:replace="~{/module/productCard.html :: productCard(${product})}"></th:block>
            </div>
        </div>
    </div>
</div>

<!--/* 페이징 바 */-->
<th:block th:replace="~{/module/Pagination :: pagination(${paging}, '/products/search', ${'&keyword=' + keyword})}"></th:block>

<!--/* 하단: 풋터 */-->
<th:block th:replace="~{/module/footer.html}"></th:block>
</body>
</html>
