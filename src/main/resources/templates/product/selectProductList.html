<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>전체 상품</title>
    <th:block th:replace="~{/module/link.html}"></th:block>
    <link rel="stylesheet" th:href="@{/css/selectProductList.css}">
    <link rel="stylesheet" th:href="@{/css/adminSidebar.css}">
    <script th:src="@{/js/selectProductList.js}"></script>
</head>
<body>
    <div class="admin-layout">
        <!--/* 왼쪽 : 사이드바 */-->
        <th:block th:replace="~{/module/adminSidebar.html}"></th:block>
        <article class="wrapper">
            <h3>전체 상품 목록</h3>
            <form class="section01 shadow-sm" th:action="@{/products/admin/list}" method="get">
                <input type="hidden" name="sort" th:value="${sort}">
                <div class="searchBox01">
                    <label>등록일</label>
                    <input type="date" name="startDate" th:value="${startDate}">
                    <span class="date-sep">-</span>
                    <input type="date" name="endDate" th:value="${endDate}">
                </div>
                <div class="searchBox02">
                    <label>상품명</label>
                    <input type="text" name="name" th:value="${name}" placeholder="상품명 검색">
                </div>
                <div class="searchBox03">
                    <label>상품코드</label>
                    <input type="text" name="productId" th:value="${productId}"
                           placeholder="예: kd-001-001">
                </div>
                <div class="searchBox05">
                    <a th:href="@{/products/admin/list}">초기화</a>
                    <button type="submit">검색</button>
                </div>
            </form>
            <form id="bulkDeleteForm" class="section02 shadow-sm" th:action="@{/products/admin/delete}" method="post">
                <div>
                    <div class="delete-actions">
                        <button type="submit" id="deleteButton">선택 삭제</button>
                    </div>
                    <div class="manage-actions">
                        <select id="sort" name="sort">
                            <option value="latest" th:selected="${sort == 'latest' || sort == null || sort == ''}">최신 등록순</option>
                            <option value="oldest" th:selected="${sort == 'oldest'}">오래된순</option>
                            <option value="lowPrice" th:selected="${sort == 'lowPrice'}">가격 낮은순</option>
                            <option value="highPrice" th:selected="${sort == 'highPrice'}">가격 높은순</option>
                        </select>
                        <a th:href="@{/products/admin/add}">등록</a>
                    </div>
                </div>
                <div>
                    <span th:text="|[전체 상품 수 ${paging.totalElements}건]|"></span>
                </div>
                <div>
                    <table>
                        <tr>
                            <th rowspan="2">
                                <input type="checkbox" id="chkAll">
                            </th>
                            <th rowspan="2">번호</th>
                            <th rowspan="2">제조국</th>
                            <th rowspan="2">상품코드</th>
                            <th rowspan="2">상품이미지</th>
                            <th rowspan="2">상품명</th>
                            <th rowspan="2">브랜드</th>
                            <th colspan="2">카테고리</th>
                            <th rowspan="2">가격</th>
                            <th rowspan="2">재고</th>
                            <th rowspan="2">관리</th>
                        </tr>
                        <tr>
                            <th>장소구분</th>
                            <th>상품분류</th>
                        </tr>
                        <tr th:each="product : ${paging}">
                            <td>
                                <input type="checkbox"
                                       class="product-checkbox"
                                       name="productIds"
                                       th:value="${product.id}">
                            </td>
                            <td th:text="${product.id}"></td>
                            <td th:text="${product.country}"></td>
                            <td th:text="${product.productId}"></td>
                            <td>
                                <a class="product-link"
                                   th:href="@{/products/detail/{id}(id=${product.id})}">
                                    <img th:src="@{|/images/${product.fileName1}|}" width="50">
                                </a>
                            </td>
                            <td>
                                <a class="product-link"
                                   th:href="@{/products/detail/{id}(id=${product.id})}"
                                   th:text="${product.name}">
                                </a>
                            </td>
                            <td th:text="${product.brand}"></td>
                            <td th:text="${product.category1}"></td>
                            <td th:text="${product.category2}"></td>
                            <td th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')}"></td>
                            <td th:text="${product.stock}"></td>
                            <td>
                                <a th:href="@{/products/admin/detail/{id}(id=${product.id})}">
                                    수정
                                </a>
                                <button type="button" class="single-delete-btn"
                                        th:data-url="@{/products/admin/delete/{id}(id=${product.id})}">
                                    삭제
                                </button>
                            </td>
                        </tr>
                    </table>
                </div>
            </form>
            <!--/* 페이지네이션 */-->
            <th:block th:with="queryParams=|&startDate=${startDate}&endDate=${endDate}&name=${name}&productId=${productId}&country=${country}|">
                <th:block th:replace="~{/module/pagination :: pagination(${paging}, '/products/admin/list', ${queryParams})}"></th:block>
            </th:block>
            <div class="current-page-info" th:if="${paging != null and !paging.isEmpty()}">
                <span th:text="|현재 페이지 ${paging.number + 1}/${paging.totalPages}페이지|"></span>
            </div>
        </article>
    </div>
</body>
</html>
